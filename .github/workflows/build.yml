          ),
          SwitchListTile(
            title: const Text('ማስታወቂያዎች (Notifications)'),
            value: true,
            onChanged: (bool value) {},
          ),
          const Divider(),
          ListTile(
            leading: const Icon(Icons.language),
            title: const Text('ቋንቋ (Language)'),
            subtitle: const Text('አማርኛ'),
            onTap: () {},
          ),
          ListTile(
            leading: const Icon(Icons.info_outline),
            title: const Text('ስለ አፕሊኬሽኑ'),
            subtitle: const Text('ဗርሽን 1.0.0'),
            onTap: () {},
          ),
        ],
      ),
    );
  }
}


